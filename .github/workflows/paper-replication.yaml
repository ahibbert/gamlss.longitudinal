name: public-paper-replication

on:
  pull_request:
    paths:
      - 'paper/**'
      - 'R/**'
      - 'DESCRIPTION'
      - '.github/workflows/paper-replication.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [smoke, paper]
        r: ['4.4.1', 'release']
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GAMLSS_LONGITUDINAL_JSS_STRICT_WARNINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          extra-repositories: https://gamlss-dev.R-universe.dev
      - name: Install Ubuntu system requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglpk-dev libgsl-dev
      - name: Install reference-environment bootstrap
        if: matrix.r == '4.4.1'
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("renv")
      - name: Install current-release dependencies
        if: matrix.r == 'release'
        shell: Rscript {0}
        run: |
          repos <- getOption("repos")
          repos <- c(
            gamlss2 = "https://gamlss-dev.r-universe.dev",
            repos[!names(repos) %in% "gamlss2"]
          )
          options(repos = repos)

          install.packages(c("renv", "jsonlite"))
          lock <- jsonlite::read_json("paper/renv.lock", simplifyVector = FALSE)
          packages <- names(lock$Packages)
          priority <- rownames(installed.packages(
            priority = c("base", "recommended")
          ))
          packages <- setdiff(packages, c(priority, "renv", "gamlss2"))
          install.packages(packages, Ncpus = 2L)
          install.packages("gamlss2", Ncpus = 2L)

          required <- c(packages, "renv", "gamlss2")
          missing <- required[!vapply(
            required,
            requireNamespace,
            quietly = TRUE,
            FUN.VALUE = logical(1)
          )]
          if (length(missing)) {
            stop("Current-release dependencies unavailable: ",
                 paste(missing, collapse = ", "))
          }
      - name: Run clean public replication
        shell: bash
        run: |
          restore=()
          if [[ "${{ matrix.r }}" == "release" ]]; then
            restore+=(--no-restore)
          fi
          Rscript paper/replicate.R \
            --profile "${{ matrix.profile }}" \
            --workers 2 \
            "${restore[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: replication-${{ matrix.os }}-r-${{ matrix.r }}-${{ matrix.profile }}
          path: results/jss-replication/

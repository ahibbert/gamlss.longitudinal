name: public-paper-replication

on:
  pull_request:
    paths:
      - 'paper/**'
      - 'R/**'
      - 'DESCRIPTION'
      - '.github/workflows/paper-replication.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [smoke, paper]
        r: ['4.4.1', 'release']
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GAMLSS_LONGITUDINAL_JSS_STRICT_WARNINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          extra-repositories: https://gamlss-dev.R-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'NA'
          extra-packages: any::renv
      - name: Run clean public replication
        shell: bash
        run: Rscript paper/replicate.R --profile "${{ matrix.profile }}" --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: replication-${{ matrix.os }}-r-${{ matrix.r }}-${{ matrix.profile }}
          path: results/jss-replication/
